<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set a new password — CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div
      class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-8"
    >
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">Virtual Binz</h1>
        <p class="text-sm text-slate-500 mt-1">Set a new password</p>
      </div>

      <!-- Shown if there's no token in the URL at all -->
      <div id="noTokenState" class="hidden text-center space-y-4">
        <p class="text-sm text-slate-600">
          This link is missing its reset token, so we can't verify it. Request a new one.
        </p>
        <a
          href="forgot-password.html"
          class="inline-block text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 rounded-md px-4 py-2 transition-colors"
          >Request a new link</a
        >
      </div>

      <form id="resetForm" novalidate class="space-y-5">
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-1"
            >New password</label
          >
          <input
            type="password"
            id="password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="6-20 characters, 1 special character"
          />
          <p id="passwordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <div>
          <label
            for="confirmPassword"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Confirm new password</label
          >
          <input
            type="password"
            id="confirmPassword"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
          />
          <p id="confirmPasswordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <div
          id="formError"
          class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2"
        ></div>

        <div
          id="formSuccess"
          class="hidden text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-md px-3 py-2"
        ></div>

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          Update password
        </button>
      </form>
    </div>

    <script>
      const API_BASE = "http://localhost:4000";
      const token = new URLSearchParams(window.location.search).get("token");

      const form = document.getElementById("resetForm");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const submitButton = form.querySelector('button[type="submit"]');

      // No token in the URL at all — nothing to submit, so hide the form
      // entirely instead of letting them fill it in and fail at the end.
      if (!token) {
        form.classList.add("hidden");
        document.getElementById("noTokenState").classList.remove("hidden");
      }

      function setError(id, message) {
        const el = document.getElementById(id + "Error");
        if (message) {
          el.textContent = message;
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      }

      function validatePassword(value) {
        const specialChar = /(?=.*[!@#$%^&*(),.?":{}|<>])/;
        if (value.length < 6 || value.length > 20) return "Password must be 6-20 characters.";
        if (!specialChar.test(value)) return "Password must include a special character.";
        return "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const passwordErr = validatePassword(passwordInput.value);
        const confirmErr =
          passwordInput.value !== confirmInput.value ? "Passwords don't match." : "";

        setError("password", passwordErr);
        setError("confirmPassword", confirmErr);

        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        errorBox.classList.add("hidden");
        successBox.classList.add("hidden");

        if (passwordErr || confirmErr) return;

        submitButton.disabled = true;
        submitButton.textContent = "Updating…";

        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: passwordInput.value }),
          });
          const data = await res.json();

          if (!res.ok) {
            if (data.errors) {
              Object.entries(data.errors).forEach(([field, message]) =>
                setError(field, message)
              );
            } else {
              errorBox.textContent = data.error || "Something went wrong.";
              errorBox.classList.remove("hidden");
            }
            return;
          }

          successBox.textContent = data.message || "Password updated — redirecting to login…";
          successBox.classList.remove("hidden");
          form.reset();
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } catch (err) {
          console.error("Reset password request failed:", err);
          errorBox.textContent =
            "Couldn't reach the server. Is the backend running on localhost:4000?";
          errorBox.classList.remove("hidden");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Update password";
        }
      });
    </script>
  </body>
</html>
