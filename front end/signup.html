<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create your account — CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div
      class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-8"
    >
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">Virtual Binz</h1>
        <p class="text-sm text-slate-500 mt-1">Create your account</p>
      </div>

      <form id="registerForm" novalidate class="space-y-5">
        <!-- Name -->
        <div>
          <label
            for="name"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Full name</label
          >
          <input
            type="text"
            id="name"
            maxlength="20"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="Nagender Rao"
          />
          <p class="text-xs text-slate-400 mt-1">
            <span id="nameCount">0</span>/20 characters
          </p>
          <p id="nameError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Email -->
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Email</label
          >
          <input
            type="text"
            id="email"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="ex-you@gmail.com"
          />
          <p id="emailError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="6-20 characters, 1 special character"
          />
          <p id="passwordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Phone -->
        <div>
          <label
            for="phone"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Phone number</label
          >
          <div class="flex">
            <span
              class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-slate-300 bg-slate-50 text-sm text-slate-600"
              >+91</span
            >
            <input
              type="text"
              id="phone"
              maxlength="10"
              inputmode="numeric"
              class="w-full rounded-r-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
              placeholder="10 digit number"
            />
          </div>
          <p id="phoneError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Organisation ID -->
        <div>
          <label
            for="orgId"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Organisation ID</label
          >
          <input
            type="text"
            id="orgId"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="e.g. ORG-4521"
          />
          <p id="orgIdError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Profile photo -->
        <div>
          <label
            for="photo"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Profile photo</label
          >
          <input
            type="file"
            id="photo"
            accept="image/*"
            class="w-full text-sm text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200"
          />
          <p class="text-xs text-slate-400 mt-1">Max size 5MB.</p>
          <p id="photoError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <div
          id="formSuccess"
          class="hidden text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-md px-3 py-2"
        ></div>

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          Create account
        </button>
      </form>

      <p class="text-sm text-slate-500 text-center mt-6">
        Already have an account?
        <a href="login.html" class="text-teal-700 font-medium hover:underline"
          >Log in</a
        >
      </p>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const nameInput = document.getElementById("name");
      const nameCount = document.getElementById("nameCount");

      // live character counter for name
      nameInput.addEventListener("input", () => {
        nameCount.textContent = nameInput.value.length;
      });

      // helper: show/hide an error message under a field
      function setError(id, message) {
        const el = document.getElementById(id + "Error");
        if (message) {
          el.textContent = message;
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      }

      function validateName(value) {
        if (value.trim() === "") return "Name is required.";
        if (value.length > 20) return "Name must be 20 characters or fewer.";
        return "";
      }

      function validateEmail(value) {
        // ^[...]+ = one or more allowed characters before the @
        // @gmail\.com$ = must end exactly with @gmail.com
        const pattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (value.trim() === "") return "Email is required.";
        if (!pattern.test(value))
          return "Only @gmail.com addresses are accepted.";
        return "";
      }

      function validatePassword(value) {
        // (?=.*[!@#$%^&*(),.?":{}|<>]) = lookahead: somewhere in the string there
        // must be at least one special character, without "consuming" it
        const specialChar = /(?=.*[!@#$%^&*(),.?":{}|<>])/;
        if (value.length < 6 || value.length > 20)
          return "Password must be 6-20 characters.";
        if (!specialChar.test(value))
          return "Password must include a special character.";
        return "";
      }

      function validatePhone(value) {
        // ^\d{10}$ = exactly 10 digits, nothing more, nothing less
        const pattern = /^\d{10}$/;
        if (value.trim() === "") return "Phone number is required.";
        if (!pattern.test(value))
          return "Enter exactly 10 digits (numbers only).";
        return "";
      }

      function validateOrgId(value) {
        if (value.trim() === "") return "Organisation ID is required.";
        return "";
      }

      function validatePhoto(fileInput) {
        const maxBytes = 5 * 1024 * 1024; // 5MB in bytes
        if (fileInput.files.length === 0) return "Profile photo is required.";
        if (fileInput.files[0].size > maxBytes)
          return "File must be under 5MB.";
        return "";
      }

      // Where the backend is running. Change this if you deploy it elsewhere.
      const API_BASE = "http://localhost:4000";

      const submitButton = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", async (e) => {
        e.preventDefault(); // stop the page from reloading — we're handling this in JS

        const nameErr = validateName(nameInput.value);
        const emailErr = validateEmail(document.getElementById("email").value);
        const passwordErr = validatePassword(
          document.getElementById("password").value
        );
        const phoneErr = validatePhone(document.getElementById("phone").value);
        const orgIdErr = validateOrgId(document.getElementById("orgId").value);
        const photoErr = validatePhoto(document.getElementById("photo"));

        setError("name", nameErr);
        setError("email", emailErr);
        setError("password", passwordErr);
        setError("phone", phoneErr);
        setError("orgId", orgIdErr);
        setError("photo", photoErr);

        const allValid = ![
          nameErr,
          emailErr,
          passwordErr,
          phoneErr,
          orgIdErr,
          photoErr,
        ].some(Boolean);

        const successBox = document.getElementById("formSuccess");
        successBox.classList.add("hidden");
        if (!allValid) return;

        // Build multipart form data so the photo file can travel alongside
        // the text fields in one request.
        const formData = new FormData();
        formData.append("name", nameInput.value);
        formData.append("email", document.getElementById("email").value);
        formData.append("password", document.getElementById("password").value);
        formData.append("phone", document.getElementById("phone").value);
        formData.append("orgId", document.getElementById("orgId").value);
        const photoFile = document.getElementById("photo").files[0];
        if (photoFile) formData.append("photo", photoFile);

        submitButton.disabled = true;
        submitButton.textContent = "Creating account…";

        try {
          const res = await fetch(`${API_BASE}/api/auth/signup`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();

          if (!res.ok) {
            // Backend found problems (e.g. duplicate email) — show them
            // under the matching fields, same as client-side validation.
            if (data.errors) {
              Object.entries(data.errors).forEach(([field, message]) =>
                setError(field, message)
              );
            } else {
              successBox.textContent = data.error || "Something went wrong.";
              successBox.classList.remove("hidden", "text-teal-700", "bg-teal-50", "border-teal-200");
              successBox.classList.add("text-red-700", "bg-red-50", "border-red-200");
            }
            return;
          }

          // Success — store the token so future requests can prove who's logged in.
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));

          successBox.textContent = `Account created — welcome, ${data.user.name}!`;
          successBox.classList.remove("hidden", "text-red-700", "bg-red-50", "border-red-200");
          successBox.classList.add("text-teal-700", "bg-teal-50", "border-teal-200");
          form.reset();
          nameCount.textContent = "0";
        } catch (err) {
          console.error("Signup request failed:", err);
          successBox.textContent =
            "Couldn't reach the server. Is the backend running on localhost:4000?";
          successBox.classList.remove("hidden", "text-teal-700", "bg-teal-50", "border-teal-200");
          successBox.classList.add("text-red-700", "bg-red-50", "border-red-200");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Create account";
        }
      });
    </script>
  </body>
</html>
