<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password — CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div
      class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-8"
    >
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">Virtual Binz</h1>
        <p class="text-sm text-slate-500 mt-1">Reset your password</p>
      </div>

      <p class="text-sm text-slate-600 mb-5">
        Enter the email and Organisation ID on your account, then choose a new password.
      </p>

      <form id="resetForm" novalidate class="space-y-5">
        <!-- Email -->
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Email</label
          >
          <input
            type="text"
            id="email"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="ex-you@gmail.com"
          />
          <p id="emailError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Organisation ID -->
        <div>
          <label
            for="orgId"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Organisation ID</label
          >
          <input
            type="text"
            id="orgId"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="e.g. ORG-4521"
          />
          <p id="orgIdError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- New password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-1"
            >New password</label
          >
          <input
            type="password"
            id="password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="6-20 characters, 1 special character"
          />
          <p id="passwordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Confirm password -->
        <div>
          <label
            for="confirmPassword"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Confirm new password</label
          >
          <input
            type="password"
            id="confirmPassword"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
          />
          <p id="confirmPasswordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <div
          id="formError"
          class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2"
        ></div>

        <div
          id="formSuccess"
          class="hidden text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-md px-3 py-2"
        ></div>

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          Reset password
        </button>
      </form>

      <p class="text-sm text-slate-500 text-center mt-6">
        Remembered it?
        <a href="login.html" class="text-teal-700 font-medium hover:underline"
          >Back to log in</a
        >
      </p>
    </div>

    <script>
      const API_BASE = "http://localhost:4000";
      const form = document.getElementById("resetForm");
      const emailInput = document.getElementById("email");
      const orgIdInput = document.getElementById("orgId");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const submitButton = form.querySelector('button[type="submit"]');

      function setError(id, message) {
        const el = document.getElementById(id + "Error");
        if (message) {
          el.textContent = message;
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      }

      function validateEmail(value) {
        const pattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (value.trim() === "") return "Email is required.";
        if (!pattern.test(value)) return "Only @gmail.com addresses are accepted.";
        return "";
      }

      function validateOrgId(value) {
        if (value.trim() === "") return "Organisation ID is required.";
        return "";
      }

      function validatePassword(value) {
        const specialChar = /(?=.*[!@#$%^&*(),.?":{}|<>])/;
        if (value.length < 6 || value.length > 20) return "Password must be 6-20 characters.";
        if (!specialChar.test(value)) return "Password must include a special character.";
        return "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const emailErr = validateEmail(emailInput.value);
        const orgIdErr = validateOrgId(orgIdInput.value);
        const passwordErr = validatePassword(passwordInput.value);
        const confirmErr =
          passwordInput.value !== confirmInput.value ? "Passwords don't match." : "";

        setError("email", emailErr);
        setError("orgId", orgIdErr);
        setError("password", passwordErr);
        setError("confirmPassword", confirmErr);

        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        errorBox.classList.add("hidden");
        successBox.classList.add("hidden");

        if (emailErr || orgIdErr || passwordErr || confirmErr) return;

        submitButton.disabled = true;
        submitButton.textContent = "Resetting…";

        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: emailInput.value,
              orgId: orgIdInput.value,
              password: passwordInput.value,
            }),
          });
          const data = await res.json();

          if (!res.ok) {
            if (data.errors) {
              Object.entries(data.errors).forEach(([field, message]) =>
                setError(field, message)
              );
            } else {
              errorBox.textContent = data.error || "Something went wrong.";
              errorBox.classList.remove("hidden");
            }
            return;
          }

          successBox.textContent = data.message || "Password updated — redirecting to login…";
          successBox.classList.remove("hidden");
          form.reset();
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } catch (err) {
          console.error("Reset password request failed:", err);
          errorBox.textContent =
            "Couldn't reach the server. Is the backend running on localhost:4000?";
          errorBox.classList.remove("hidden");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Reset password";
        }
      });
    </script>
  </body>
</html>
