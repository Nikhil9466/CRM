<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div
      class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-8"
    >
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">Virtual Binz</h1>
        <p class="text-sm text-slate-500 mt-1">Log in to your account</p>
      </div>

      <form id="loginForm" novalidate class="space-y-5">
        <!-- Email -->
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Email</label
          >
          <input
            type="text"
            id="email"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="ex-you@gmail.com"
          />
          <p id="emailError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-slate-700"
              >Password</label
            >
            <a href="#" class="text-xs text-teal-700 hover:underline"
              >Forgot password?</a
            >
          </div>
          <input
            type="password"
            id="password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600"
            placeholder="Enter your password"
          />
          <p id="passwordError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <!-- Remember me -->
        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            id="remember"
            class="h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-600"
          />
          <label for="remember" class="text-sm text-slate-600"
            >Keep me signed in</label
          >
        </div>

        <div
          id="formError"
          class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2"
        ></div>

        <div
          id="formSuccess"
          class="hidden text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-md px-3 py-2"
        ></div>

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          Log in
        </button>
      </form>

      <p class="text-sm text-slate-500 text-center mt-6">
        Don't have an account?
        <a
          href="signup.html"
          class="text-teal-700 font-medium hover:underline"
          >Sign up</a
        >
      </p>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      function setError(id, message) {
        const el = document.getElementById(id + "Error");
        if (message) {
          el.textContent = message;
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      }

      function validateEmail(value) {
        // same rule as signup: only @gmail.com addresses accepted
        const pattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (value.trim() === "") return "Email is required.";
        if (!pattern.test(value))
          return "Only @gmail.com addresses are accepted.";
        return "";
      }

      function validatePassword(value) {
        // login only checks presence — full password rules are enforced at signup
        if (value.trim() === "") return "Password is required.";
        return "";
      }

      // Where the backend is running. Change this if you deploy it elsewhere.
      const API_BASE = "http://localhost:4000";
      const submitButton = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const emailErr = validateEmail(emailInput.value);
        const passwordErr = validatePassword(passwordInput.value);

        setError("email", emailErr);
        setError("password", passwordErr);

        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        errorBox.classList.add("hidden");
        successBox.classList.add("hidden");

        const allValid = !emailErr && !passwordErr;
        if (!allValid) return;

        submitButton.disabled = true;
        submitButton.textContent = "Logging in…";

        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: emailInput.value,
              password: passwordInput.value,
            }),
          });
          const data = await res.json();

          if (!res.ok) {
            if (data.errors) {
              Object.entries(data.errors).forEach(([field, message]) =>
                setError(field, message)
              );
            } else {
              errorBox.textContent = data.error || "Login failed.";
              errorBox.classList.remove("hidden");
            }
            return;
          }

          // Store the token so future pages can prove the user is logged in.
          // "Keep me signed in" unchecked still uses localStorage here for
          // simplicity — swap for sessionStorage if you want it to clear on tab close.
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));

          successBox.textContent = `Welcome back, ${data.user.name}!`;
          successBox.classList.remove("hidden");
          // Once you build a dashboard page, redirect here instead:
          // window.location.href = "dashboard.html";
        } catch (err) {
          console.error("Login request failed:", err);
          errorBox.textContent =
            "Couldn't reach the server. Is the backend running on localhost:4000?";
          errorBox.classList.remove("hidden");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Log in";
        }
      });
    </script>
  </body>
</html>
